# CI/CD Pipeline for MindCode IDE

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史以按提交范围扫描
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan new commits for secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # 只扫本次 PR/push 新引入的提交，阻断新泄露；不因历史遗留 key 而失败
          # （历史遗留见 docs/refactor/04_SECRET_REMEDIATION_PLAN.md，需另行处置）。
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "无有效基线，改扫工作树"
            gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose
          else
            echo "扫描范围: ${BASE}..${{ github.sha }}"
            gitleaks detect --source . --config .gitleaks.toml --log-opts "${BASE}..${{ github.sha }}" --redact --verbose
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  # 真实 Electron + Playwright。发现 src/test/e2e/*.spec.ts 全部用例，不按名字过滤。
  # 只跑 Linux+xvfb；与本地 macOS/Windows 规格相同，平台差异见 PR 说明。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 只缓存 Electron 官方 zip，不缓存 node_modules/electron/dist，避免把缺失二进制当成命中。
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install xvfb and Electron OS libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxss1 \
            libxtst6 \
            fonts-liberation
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libasound2t64 \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libasound2

      - run: npm ci

      - name: Verify Electron binary exists
        run: |
          set -euo pipefail
          DIST="node_modules/electron/dist"
          if [ ! -x "$DIST/electron" ] && [ ! -d "$DIST/Electron.app" ]; then
            echo "Electron binary missing; running installer"
            ls -la node_modules/electron || true
            ls -la "$DIST" || true
            node node_modules/electron/install.js
          fi
          if [ ! -x "$DIST/electron" ] && [ ! -d "$DIST/Electron.app" ]; then
            echo "ERROR: Electron binary still missing after installer"
            ls -la "$DIST" || true
            exit 1
          fi
          echo "Electron dist:"
          ls -la "$DIST"

      - name: Discover e2e specs (no skips)
        run: |
          set -euo pipefail
          mapfile -t SPECS < <(find src/test/e2e -name '*.spec.ts' | sort)
          echo "Discovered ${#SPECS[@]} spec file(s):"
          printf '  %s\n' "${SPECS[@]}"
          if [ "${#SPECS[@]}" -lt 1 ]; then
            echo "ERROR: no e2e specs found under src/test/e2e"
            exit 1
          fi
          if grep -RInE 'test\.(skip|fixme)\(|describe\.(skip|fixme)\(' src/test/e2e --include='*.ts'; then
            echo "ERROR: e2e must not skip/fixme tests to stay green"
            exit 1
          fi

      - run: npm run build

      - name: Run Electron e2e under xvfb
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:e2e

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: [secret-scan, lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # 验证构建产物完整性
      - name: Verify build output (main process)
        shell: bash
        run: |
          if [ ! -f "dist/main/main/index.js" ]; then
            echo "ERROR: Main process entry point not found at dist/main/main/index.js"
            exit 1
          fi
          echo "Main process build verified."

      - name: Verify build output (renderer)
        shell: bash
        run: |
          if [ ! -f "dist/renderer/index.html" ]; then
            echo "ERROR: Renderer index.html not found at dist/renderer/index.html"
            exit 1
          fi
          echo "Renderer build verified."

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/
          retention-days: 7
